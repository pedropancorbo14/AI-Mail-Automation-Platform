x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-app}
  DB_USERNAME: ${DB_USERNAME:-app}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  LOG_CHANNEL: stack

networks:
  app-net:
    driver: bridge
  observability-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  app-storage:
  ollama-data:
  node-modules:

services:
  # ---------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------
  app:
    build: *app-build
    image: ai-mail-automation-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *app-env
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - observability-net
    labels:
      - "logging=promtail"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Solo en 127.0.0.1 (Fase 12): para abrir la app a la red, APP_BIND=0.0.0.0
    # (en producción va detrás de un proxy con HTTPS, Fase 16).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net
      # Prometheus lee /metrics a través de nginx (Fase 11).
      - observability-net
    labels:
      - "logging=promtail"
  # ---------------------------------------------------------------
  # Horizon (gestiona los workers de colas Redis; el número de procesos
  # y supervisores se configura en config/horizon.php, no aquí)
  # ---------------------------------------------------------------
  horizon:
     build: *app-build
     image: ai-mail-automation-app:latest
     restart: unless-stopped
     working_dir: /var/www/html
     command: php artisan horizon
     environment:
       <<: *app-env
     volumes:
       - ./:/var/www/html
       - app-storage:/var/www/html/storage
     depends_on:
       postgres:
         condition: service_healthy
       redis:
         condition: service_healthy
     networks:
       - app-net
       - observability-net
     stop_signal: SIGTERM
     stop_grace_period: 30s
     labels:
       - "logging=promtail"

  scheduler:
    build: *app-build
    image: ai-mail-automation-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      <<: *app-env
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
    labels:
      - "logging=promtail"

  # ---------------------------------------------------------------
  # Microservicio de IA en Python (ai-service) + consumidor de sus
  # resultados en Laravel. Solo con el perfil "ai-service" (AI_ENGINE=python):
  #   COMPOSE_PROFILES=ai-service en .env, o docker compose --profile ai-service up -d
  # ---------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
    image: ai-mail-automation-ai-service:latest
    profiles: ["ai-service"]
    restart: unless-stopped
    environment:
      AI_SERVICE_ENVIRONMENT: ${AI_SERVICE_ENVIRONMENT:-production}
      AI_SERVICE_LOG_LEVEL: ${AI_SERVICE_LOG_LEVEL:-INFO}
      AI_SERVICE_LLM_PROVIDER: ${AI_SERVICE_LLM_PROVIDER:-anthropic}
      AI_SERVICE_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_SERVICE_ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # Misma BD de Redis (sin prefijo) que la conexión "streams" de Laravel.
      AI_SERVICE_REDIS_URL: redis://:${REDIS_PASSWORD:-secret}@redis:6379/${REDIS_STREAMS_DB:-3}
      AI_SERVICE_DEBUG_ENDPOINTS: ${AI_SERVICE_DEBUG_ENDPOINTS:-false}
      # RAG (Fase 2): solo lectura con el rol ai_service_reader (RLS por
      # empresa) y el mismo modelo de embeddings que indexa Laravel.
      AI_SERVICE_DATABASE_URL: postgresql+psycopg://ai_service_reader:${AI_SERVICE_DB_PASSWORD:-reader-secret}@postgres:5432/${DB_DATABASE:-app}
      AI_SERVICE_OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      AI_SERVICE_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      # Herramientas (Fase 3): CRM, ERP y tickets en el servidor MCP.
      AI_SERVICE_MCP_URL: http://ai-mcp:8100
      AI_SERVICE_MCP_TOKEN: ${AI_SERVICE_MCP_TOKEN:-local-mcp-token}
    # Solo local: /health, /ready, /metrics y (si se activa) /debug/process.
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-mcp:
        condition: service_healthy
    networks:
      - app-net
      # Prometheus lee su /metrics directamente.
      - observability-net
    # Endurecido: sistema de archivos de solo lectura, sin capacidades.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Termina los emails en curso antes de parar (lo no confirmado se reclama).
    stop_grace_period: 60s
    labels:
      - "logging=promtail"

  # Servidor MCP (Fase 3): CRM, ERP y tickets para el grafo de ai-service.
  # Misma imagen, otro proceso. Sin puertos publicados: solo lo llama
  # ai-service por la red interna, con token.
  ai-mcp:
    image: ai-mail-automation-ai-service:latest
    profiles: ["ai-service"]
    restart: unless-stopped
    command: ai-service-mcp
    environment:
      AI_SERVICE_MCP_TOKEN: ${AI_SERVICE_MCP_TOKEN:-local-mcp-token}
      # Los MISMOS pedidos de demostración que el DemoOrderProvider de Laravel.
      AI_SERVICE_MCP_ORDERS_FILE: /data/orders.json
    volumes:
      - ./database/seeders/demo/orders.json:/data/orders.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - app-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      - "logging=promtail"

  ai-results:
    build: *app-build
    image: ai-mail-automation-app:latest
    profiles: ["ai-service"]
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan ai:consume-results
    environment:
      <<: *app-env
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
    stop_signal: SIGTERM
    stop_grace_period: 30s
    labels:
      - "logging=promtail"

  # ---------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    # Solo en 127.0.0.1: para clientes gráficos (HeidiSQL, DBeaver...) desde tu
    # máquina, nunca abierto a la red. 5433 porque el 5432 suele estar ocupado
    # por un PostgreSQL local. Los contenedores siguen usando postgres:5432.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ---------------------------------------------------------------
  # Servidor de correo de PRUEBAS (IMAP + SMTP) para desarrollo y tests.
  # No envía nada fuera: todo se queda en memoria. Los tests crean sus
  # propias cuentas con la API REST (puerto 8080 interno).
  # Desde tu máquina: IMAP 127.0.0.1:3143, SMTP 127.0.0.1:3025 (sin TLS),
  # cuenta demo soporte@demo.test / secret.
  # ---------------------------------------------------------------
  greenmail:
    image: greenmail/standalone:2.1.5
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=soporte:secret@demo.test
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${GREENMAIL_IMAP_PORT:-3143}:3143"
    networks:
      - app-net

  # Servidor de desarrollo del panel (Vite, Fase 10): recompila al guardar.
  # node_modules vive en un volumen: los binarios nativos de Windows no
  # sirven en Linux. En producción el panel se compila (npm run build).
  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      # Los cambios en ficheros de Windows no llegan al contenedor como eventos: sondeo.
      VITE_POLLING: "true"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    networks:
      - app-net

  # Modelos de IA locales (embeddings del RAG, Fase 6). Solo en la red
  # interna: los documentos de las empresas no salen del servidor.
  # Descargar el modelo una vez: docker compose exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      # El modelo queda cargado en memoria 1 h tras la última petición.
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-net

  # ---------------------------------------------------------------
  # Metrics exporters
  # ---------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-app}:${DB_PASSWORD:-secret}@postgres:5432/${DB_DATABASE:-app}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - app-net
      - observability-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.94.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    depends_on:
      - redis
    networks:
      - app-net
      - observability-net

  # ---------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/prometheus/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 400 días: comparar costes y volumen mes a mes (las métricas ocupan poco).
      - "--storage.tsdb.retention.time=400d"
    # Solo en 127.0.0.1: Prometheus no tiene usuario/contraseña.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability-net

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    # Solo en 127.0.0.1: Loki no tiene autenticación (cualquiera podría leer o inventar logs).
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - observability-net

  promtail:
    image: grafana/promtail:3.6.8
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - app-storage:/var/www/html/storage:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Seguridad (Fase 12): sin acceso anónimo, sin avatares externos (Gravatar)
      # ni llamadas a grafana.com, y cookies solo del mismo sitio.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Al entrar, el dashboard General de la plataforma (Fase 11).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-mail/general.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards/ai-mail:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - observability-net