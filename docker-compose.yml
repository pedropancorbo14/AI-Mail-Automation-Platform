x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-app}
  DB_USERNAME: ${DB_USERNAME:-app}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  LOG_CHANNEL: stack

networks:
  app-net:
    driver: bridge
  observability-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  app-storage:
  ollama-data:

services:
  # ---------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------
  app:
    build: *app-build
    image: ai-mail-automation-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *app-env
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - observability-net
    labels:
      - "logging=promtail"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net
    labels:
      - "logging=promtail"
  # ---------------------------------------------------------------
  # Horizon (gestiona los workers de colas Redis; el número de procesos
  # y supervisores se configura en config/horizon.php, no aquí)
  # ---------------------------------------------------------------
  horizon:
     build: *app-build
     image: ai-mail-automation-app:latest
     restart: unless-stopped
     working_dir: /var/www/html
     command: php artisan horizon
     environment:
       <<: *app-env
     volumes:
       - ./:/var/www/html
       - app-storage:/var/www/html/storage
     depends_on:
       postgres:
         condition: service_healthy
       redis:
         condition: service_healthy
     networks:
       - app-net
       - observability-net
     stop_signal: SIGTERM
     stop_grace_period: 30s
     labels:
       - "logging=promtail"

  scheduler:
    build: *app-build
    image: ai-mail-automation-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      <<: *app-env
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
    labels:
      - "logging=promtail"

  # ---------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    # Solo en 127.0.0.1: para clientes gráficos (HeidiSQL, DBeaver...) desde tu
    # máquina, nunca abierto a la red. 5433 porque el 5432 suele estar ocupado
    # por un PostgreSQL local. Los contenedores siguen usando postgres:5432.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ---------------------------------------------------------------
  # Servidor de correo de PRUEBAS (IMAP + SMTP) para desarrollo y tests.
  # No envía nada fuera: todo se queda en memoria. Los tests crean sus
  # propias cuentas con la API REST (puerto 8080 interno).
  # Desde tu máquina: IMAP 127.0.0.1:3143, SMTP 127.0.0.1:3025 (sin TLS),
  # cuenta demo soporte@demo.test / secret.
  # ---------------------------------------------------------------
  greenmail:
    image: greenmail/standalone:2.1.5
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=soporte:secret@demo.test
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${GREENMAIL_IMAP_PORT:-3143}:3143"
    networks:
      - app-net

  # Modelos de IA locales (embeddings del RAG, Fase 6). Solo en la red
  # interna: los documentos de las empresas no salen del servidor.
  # Descargar el modelo una vez: docker compose exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      # El modelo queda cargado en memoria 1 h tras la última petición.
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-net

  # ---------------------------------------------------------------
  # Metrics exporters
  # ---------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-app}:${DB_PASSWORD:-secret}@postgres:5432/${DB_DATABASE:-app}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - app-net
      - observability-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    depends_on:
      - redis
    networks:
      - app-net
      - observability-net

  # ---------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability-net

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - observability-net

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - app-storage:/var/www/html/storage:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - observability-net