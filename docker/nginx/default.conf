server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    # No anunciar versiones (nginx en "Server", PHP en "X-Powered-By").
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # DNS interno de Docker: con el upstream en una variable, nginx resuelve
    # "app" en cada petición. Con "fastcgi_pass app:9000" lo resolvía solo al
    # arrancar y, si el contenedor app se recreaba (nueva IP), daba 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /metrics {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
}
