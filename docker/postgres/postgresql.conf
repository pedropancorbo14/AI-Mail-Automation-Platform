# Configuración personalizada de PostgreSQL.
# Se monta sobre la configuración por defecto de la imagen.
# Ajusta estos valores según los recursos reales de tu servidor.

listen_addresses = '*'
max_connections = 100

# Memoria (valores conservadores para 1-2 GB de RAM dedicada a Postgres;
# súbelos si el servidor tiene más recursos)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL / checkpoints
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Logging (útil junto con Loki/Promtail)
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'none'