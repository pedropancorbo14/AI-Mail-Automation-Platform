apiVersion: 1

# Dashboards de la plataforma (Fase 11), versionados en docker/grafana/dashboards.
# Se pueden editar en Grafana, pero al reiniciar manda el fichero: para guardar
# un cambio, exportar el JSON (Share → Export) y sustituir el fichero.
providers:
  - name: ai-mail
    orgId: 1
    folder: "AI Mail Automation"
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/ai-mail
