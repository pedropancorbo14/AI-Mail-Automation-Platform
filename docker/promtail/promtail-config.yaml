server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # Servicio del compose (app, horizon, ai-service...): filtra sin depender
      # del nombre del proyecto.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # ai-service escribe JSON (structlog) con "level" en mayúsculas como
      # Laravel: el nivel pasa a etiqueta y la hora es la del propio log.
      # trace_id, tenant_id y email_id NO son etiquetas (demasiadas series):
      # {service="ai-service"} | json | tenant_id="1"
      - match:
          selector: '{service="ai-service"}'
          stages:
            - json:
                expressions:
                  level: level
                  time: timestamp
            - labels:
                level:
            - timestamp:
                source: time
                format: RFC3339Nano

  # Log de Laravel en JSON (canal "json", Fase 11): una línea por entrada con
  # message, level_name, context (datos del log) y extra (Context de Laravel:
  # tenant_id, request_id...). En Grafana: {job="laravel"} | json
  # El nivel es etiqueta (pocos valores); tenant_id/request_id NO (serían
  # demasiadas series): se filtran con | json | extra_tenant_id="1".
  - job_name: laravel-app-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: laravel
          __path__: /var/www/html/storage/logs/json/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level_name
            time: datetime
      - labels:
          level:
      # La hora del log (no la de lectura): ordena bien aunque Promtail se retrase.
      - timestamp:
          source: time
          format: RFC3339Nano