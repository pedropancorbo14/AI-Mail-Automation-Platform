; Configuración de PHP común a desarrollo y producción (Fase 16).
; Sin este fichero PHP usa sus valores por defecto: subidas de 2 MB, así que un
; documento de 20 MB o un adjunto de 25 MB no llegaban a Laravel.
upload_max_filesize = 25M
post_max_size = 26M
memory_limit = 256M
; No anunciar la versión de PHP (cabecera X-Powered-By).
expose_php = Off
; Las trazas de las excepciones sin los argumentos de las funciones (podrían
; llevar contraseñas). bootstrap/app.php también lo fija.
zend.exception_ignore_args = On
