; OPcache en producción (Fase 16): el código no cambia dentro de la imagen, así
; que PHP no comprueba en cada petición si un fichero ha cambiado.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
