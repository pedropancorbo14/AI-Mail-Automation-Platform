global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertas (Fase 11): ver alerts.yml y sus pruebas en alerts.test.yml.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas propias de la plataforma (Fase 11): GET /metrics a través de
  # nginx, con el token de METRICS_TOKEN. "local-metrics-token" es el valor
  # de desarrollo de .env.docker.example; en producción (Fase 16) se cambia
  # en los dos sitios.
  - job_name: "laravel"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local-metrics-token
    static_configs:
      - targets: ["nginx:80"]

  # ai-service (Python, el motor de IA): descubierto por DNS (se puede
  # escalar a varias réplicas); si no responde, up = 0.
  - job_name: "ai-service"
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["ai-service"]
        type: A
        port: 8000
        refresh_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]