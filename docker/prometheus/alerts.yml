# Alertas de la plataforma (Fase 11). Las evalúa Prometheus cada 15 s y se
# ven en http://localhost:9090/alerts y en Grafana (Alerting → Alert rules).
# Todavía no se envían a ningún sitio: eso es Alertmanager (Fase 16).
# Probadas con: promtool test rules docker/prometheus/alerts.test.yml
groups:
  - name: plataforma
    rules:
      - alert: MetricasNoDisponibles
        expr: up{job="laravel"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus no puede leer /metrics de la aplicación"
          description: "La app (nginx/PHP-FPM) no responde o el token de METRICS_TOKEN no coincide. Sin métricas, el resto de alertas no funcionan."

      - alert: AlertmanagerCaido
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager no responde: las alertas no se están enviando"
          description: "Solo en producción. docker compose -f docker-compose.prod.yml logs alertmanager (¿configuración de ALERT_* incorrecta?)."

      - alert: CopiaDeSeguridadAtrasada
        expr: time() - aimail_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No hay una copia de seguridad correcta desde hace más de 26 horas"
          description: "El contenedor backup copia cada día y prueba a restaurar cada copia (docker compose -f docker-compose.prod.yml logs backup). Si el valor es 0, nunca ha salido bien ninguna."

      - alert: EstadoNoDisponible
        expr: aimail_state_metrics_ok == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No se puede calcular el estado actual ({{ $labels.section }})"
          description: "Las consultas de /metrics a la base de datos o a las colas fallan. Ver el log (\"No se pudo calcular una métrica de estado\")."

      - alert: TrabajosDeColaFallando
        # increase() no ve la PRIMERA aparición de una serie (de nada a 1): si no
        # existía hace 15 min, su valor total es el aumento ("unless ... offset").
        expr: |
          sum by (queue, job_class) (increase(aimail_jobs_processed_total{result="failed"}[15m])) > 0
          or sum by (queue, job_class) (aimail_jobs_processed_total{result="failed"} unless aimail_jobs_processed_total{result="failed"} offset 15m)
        labels:
          severity: warning
        annotations:
          summary: "El trabajo {{ $labels.job_class }} ha fallado definitivamente en la cola {{ $labels.queue }}"
          description: "{{ $value | humanize }} fallos en 15 min (ya agotó sus reintentos). Ver Horizon → Failed Jobs y los logs en Grafana."

      - alert: ColaAtascada
        expr: aimail_queue_size > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La cola {{ $labels.connection }}:{{ $labels.queue }} tiene {{ $value }} trabajos esperando"
          description: "Los workers no dan abasto o están parados (php artisan horizon:status)."

      - alert: ErroresHttp5xx
        expr: |
          sum(rate(aimail_http_requests_total{status=~"5.."}[10m]))
            / sum(rate(aimail_http_requests_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Más del 5 % de las peticiones HTTP terminan en error 5xx"
          description: "Errores de servidor: {{ $value | humanizePercentage }}. Ver el dashboard Errores."

  - name: correo
    rules:
      - alert: BuzonAtascado
        expr: aimail_mail_sync_consecutive_failures >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El buzón {{ $labels.mailbox }} de {{ $labels.tenant }} lleva {{ $value }} sincronizaciones fallidas seguidas"
          description: "El cursor no avanza: el servidor no responde o rechaza la cuenta (un correo que falla siempre se aparta solo tras MAIL_SYNC_SKIP_AFTER_FAILURES intentos). Ver mail_sync_states.last_error."

      - alert: CorreoApartado
        expr: |
          sum by (tenant, provider) (increase(aimail_mail_messages_skipped_total[15m])) > 0
          or sum by (tenant, provider) (aimail_mail_messages_skipped_total unless aimail_mail_messages_skipped_total offset 15m) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.tenant }}: un correo se ha apartado porque falla siempre al guardarlo"
          description: "La sincronización lo saltó para no atascar el buzón. El correo sigue en el buzón del cliente: buscarlo en mail_skipped_messages (remitente, asunto, error) y ver el detalle en los logs (\"Correo apartado\")."

      - alert: BuzonSinSincronizar
        expr: time() - aimail_mail_sync_last_success_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El buzón {{ $labels.mailbox }} de {{ $labels.tenant }} no se sincroniza desde hace más de 15 min"
          description: "¿Está corriendo el scheduler (mail:sync cada minuto) y el supervisor de la cola mail?"

      - alert: EmailsConError
        expr: |
          sum by (tenant) (increase(aimail_email_status_changes_total{to="failed"}[15m])) >= 3
          or sum by (tenant) (aimail_email_status_changes_total{to="failed"} unless aimail_email_status_changes_total{to="failed"} offset 15m) >= 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanize }} emails de {{ $labels.tenant }} han pasado a error en 15 min"
          description: "Revisar en el panel los emails con estado Error (motivo en su historial) y reprocesarlos con ai:process --failed."

      - alert: RevisionHumanaAcumulada
        expr: sum by (tenant) (aimail_emails_current{status="human_review"}) > 50
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.tenant }} tiene {{ $value }} emails esperando a una persona"
          description: "La bandeja de revisión crece: falta personal o la automatización deriva demasiado."

      - alert: CasoSinAtender
        expr: max by (tenant) (aimail_email_review_oldest_waiting_seconds) > 4 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El caso más antiguo de {{ $labels.tenant }} lleva {{ $value | humanizeDuration }} esperando a una persona"
          description: "Abrir la bandeja de revisión del panel: los casos urgentes y los más antiguos salen primero."

  - name: ia
    rules:
      - alert: IAConErrores
        expr: |
          sum(rate(aimail_ai_requests_total{status!="success"}[10m]))
            / sum(rate(aimail_ai_requests_total[10m])) > 0.2
          and sum(increase(aimail_ai_requests_total[10m])) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Más del 20 % de las peticiones a la IA fallan o se rechazan"
          description: "{{ $value | humanizePercentage }} de errores. ¿Saldo de la API, clave, 429 o caída del proveedor? Ver el dashboard IA."

      - alert: GastoIAPorHoraAlto
        expr: sum(increase(aimail_ai_cost_usd_total[1h])) > 5
        labels:
          severity: warning
        annotations:
          summary: "La IA ha gastado {{ $value | printf \"%.2f\" }} $ en la última hora"
          description: "Por encima de 5 $/h. Revisar el dashboard Costes (por empresa y modelo) por si hay un bucle o un pico anómalo."

      - alert: IAFrenadaPorLimites
        expr: |
          sum by (tenant, reason) (increase(aimail_ai_guard_blocks_total{reason=~"budget|sender"}[15m])) > 0
          or sum by (tenant, reason) (aimail_ai_guard_blocks_total{reason=~"budget|sender"} unless aimail_ai_guard_blocks_total offset 15m) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.tenant }}: emails sin IA por límite de gasto ({{ $labels.reason }})"
          description: "budget = la empresa agotó su presupuesto diario (ver ai:budget); sender = un remitente supera el máximo de emails en 24 h (¿inundación o bucle con otro sistema?). Esos emails los atiende una persona. Los frenos del plan (subscription, plan_emails, plan_budget) no alertan aquí: son de negocio."

  # Microservicio de IA en Python (ai-service) y el consumidor de sus
  # resultados en Laravel.
  - name: ai-service
    rules:
      - alert: ServicioIANoResponde
        expr: up{job="ai-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus no puede leer /metrics de ai-service ({{ $labels.instance }})"
          description: "El worker de Python está caído o reiniciándose (¿falta AI_SERVICE_ANTHROPIC_API_KEY?). Los emails se quedan en processing y ai:reconcile-remote los republicará. docker compose logs ai-service."

      - alert: ConsumidorIAParado
        expr: time() - aiservice_consumer_heartbeat_timestamp_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "El bucle del consumidor de ai-service ({{ $labels.instance }}) no gira desde hace {{ $value | humanizeDuration }}"
          description: "El proceso responde pero no lee eventos (colgado o Redis inaccesible). /ready ya devuelve 503; reiniciar el contenedor."

      - alert: ColaIAAtascada
        expr: sum(aiservice_stream_lag) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} emails esperando a ai-service sin leer"
          description: "Entran más emails de los que procesa (o el modelo va lento). Añadir réplicas o subir AI_SERVICE_CONCURRENCY; mirar la latencia de las llamadas al modelo."

      - alert: EmailsIAFallidos
        expr: |
          sum(increase(aiservice_events_total{result=~"failed|dead_lettered"}[15m])) >= 3
          or sum(aiservice_events_total{result=~"failed|dead_lettered"} unless aiservice_events_total{result=~"failed|dead_lettered"} offset 15m) >= 3
        labels:
          severity: warning
        annotations:
          summary: "ai-service no pudo procesar {{ $value }} emails en 15 min"
          description: "Errores definitivos del modelo (clave, saldo, rechazos) o reintentos agotados. Logs: {service=\"ai-service\", level=\"ERROR\"} en Loki."

      - alert: ResultadoIAEmpresaIncorrecta
        expr: |
          sum(increase(aimail_ai_remote_results_total{result="tenant_mismatch"}[15m])) > 0
          or sum(aimail_ai_remote_results_total{result="tenant_mismatch"} unless aimail_ai_remote_results_total{result="tenant_mismatch"} offset 15m) > 0
        labels:
          severity: critical
        annotations:
          summary: "Laravel ha descartado un resultado de IA con una empresa que no es la del email"
          description: "Nunca debería ocurrir: posible bug en ai-service o mensajes manipulados en Redis. El resultado no se aplicó; está en email.processed.v1.dlq. Investigar ya."

      - alert: ReanudacionIARechazada
        expr: |
          sum(increase(aiservice_events_total{result="rejected"}[15m])) > 0
          or sum(aiservice_events_total{result="rejected"} unless aiservice_events_total{result="rejected"} offset 15m) > 0
        labels:
          severity: critical
        annotations:
          summary: "ai-service ha rechazado una reanudación que no corresponde a la acción en pausa"
          description: "La aprobación o el rechazo llegó para otra empresa, otro email u otra acción. No se ejecutó nada; está en email.review_resumed.v1.dlq. Posible bug en Laravel o mensajes manipulados en Redis: investigar ya."

      - alert: ResultadosIAEnColaDeErrores
        expr: |
          sum by (result) (increase(aimail_ai_remote_results_total{result=~"invalid|dead_lettered"}[15m])) > 0
          or sum by (result) (aimail_ai_remote_results_total{result=~"invalid|dead_lettered"} unless aimail_ai_remote_results_total{result=~"invalid|dead_lettered"} offset 15m) > 0
        labels:
          severity: warning
        annotations:
          summary: "Resultados de ai-service en la cola de errores de Laravel ({{ $labels.result }})"
          description: "invalid = no cumplen el contrato (¿versiones distintas de Laravel y ai-service?); dead_lettered = fallaron al aplicarse varias veces. Revisar los streams *.dlq y el log de ai-results."

  # SaaS (Fase 17): planes y cobro de cada empresa. Avisos de negocio
  # (info) salvo el cobro y los avisos de Stripe con firma mala.
  - name: saas
    rules:
      - alert: PruebaTerminaPronto
        expr: |
          (aimail_tenant_trial_ends_timestamp_seconds - time()) < 3 * 86400
          and (aimail_tenant_trial_ends_timestamp_seconds - time()) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.tenant }}: su prueba termina en menos de 3 días"
          description: "Al terminar, la IA se para y los emails los atiende su equipo hasta que elija un plan. Buen momento para escribirles."

      - alert: EmpresaEnElLimiteDeIA
        expr: max by (tenant, limit) (aimail_tenant_plan_usage_ratio{limit=~"ai_emails_per_month|ai_budget_usd_per_month"}) >= 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.tenant }}: ha agotado el límite {{ $labels.limit }} de su plan este mes"
          description: "Sus emails nuevos van a una persona sin IA hasta el mes que viene. Ofrecerle un plan mayor (tenant:plan o desde su panel)."

      - alert: PagoDeSuscripcionFallido
        expr: max by (tenant, plan) (aimail_tenant_plan{status="past_due"}) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.tenant }}: el último cobro de su suscripción ({{ $labels.plan }}) falló"
          description: "Stripe sigue reintentando. Pasados SAAS_PAST_DUE_GRACE_DAYS días sin pagar, la IA se para. Contactar con la empresa."

      - alert: AvisosDeStripeConFirmaMala
        expr: |
          sum(increase(aimail_billing_webhooks_total{result="invalid_signature"}[15m])) > 0
          or sum(aimail_billing_webhooks_total{result="invalid_signature"} unless aimail_billing_webhooks_total{result="invalid_signature"} offset 15m) > 0
        labels:
          severity: warning
        annotations:
          summary: "Avisos a /api/v1/webhooks/stripe con una firma no válida"
          description: "O STRIPE_WEBHOOK_SECRET no es el del webhook de Stripe (los pagos no activarían planes) o alguien está probando la URL. Comparar el secreto en el panel de Stripe."
