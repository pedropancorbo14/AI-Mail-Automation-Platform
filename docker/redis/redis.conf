# Configuración personalizada de Redis.
# Se monta sobre la imagen oficial, sustituyendo al "command:" inline que
# teníamos antes en docker-compose.yml.

bind 0.0.0.0
protected-mode yes
port 6379

# Autenticación: se pasa por línea de comandos desde docker-compose.yml
# (variable REDIS_PASSWORD), no se fija aquí en texto plano.
# requirepass se añade vía "--requirepass" al arrancar el contenedor.

# Persistencia RDB (snapshots)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb
dir /data

# Persistencia AOF (más segura para colas de Laravel/Horizon: menos
# probabilidad de perder jobs encolados si el contenedor muere)
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Memoria: evita que Redis crezca sin límite: cuando llegue al máximo,
# expira primero las claves con TTL (útil para caché); ajusta según RAM real
maxmemory 256mb
maxmemory-policy volatile-lru

# Logging
loglevel notice