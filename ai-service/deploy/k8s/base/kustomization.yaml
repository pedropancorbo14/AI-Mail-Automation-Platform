# Base de ai-service para Kubernetes. No se aplica sola: le falta el Secret
# ai-service-secrets, que pone cada overlay (local con valores de desarrollo,
# production creado fuera del repositorio).
#
# Los datos de demostración del servidor MCP van dentro de la imagen.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aimail-ai

labels:
  - pairs:
      app.kubernetes.io/part-of: ai-mail-automation
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - ai-service.yaml
  - ai-mcp.yaml
  - networkpolicies.yaml

# Configuración no secreta. El nombre lleva un hash del contenido: cambiar un
# valor crea un ConfigMap nuevo y reinicia los pods que lo usan.
configMapGenerator:
  - name: ai-service-config
    literals:
      - AI_SERVICE_ENVIRONMENT=production
      - AI_SERVICE_LOG_LEVEL=INFO
      - AI_SERVICE_LLM_PROVIDER=anthropic
      - AI_SERVICE_MCP_URL=http://ai-mcp:8100
      - AI_SERVICE_OLLAMA_URL=http://ollama:11434
      # Laravel, para descargar el original de un documento al indexarlo (ruta firmada).
      - AI_SERVICE_LARAVEL_URL=http://nginx
      - AI_SERVICE_CONCURRENCY=4
