# Worker de ai-service: consume email.received.v1 y email.review_resumed.v1
# de Redis Streams, ejecuta el grafo y publica el resultado. Escala en
# horizontal sin coordinación: cada réplica es un consumidor del mismo grupo
# (su nombre es el del pod) y Redis reparte los mensajes; los abandonados por
# una réplica caída los reclama otra (XAUTOCLAIM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ai-service
      automountServiceAccountToken: false
      # Al recibir SIGTERM deja de leer, termina los emails en curso y sale.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: aimail/ai-service:dev
          imagePullPolicy: IfNotPresent
          command: ["ai-service-worker"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-service-config
            - secretRef:
                name: ai-service-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # /health: el proceso responde (si no, se reinicia).
          # /ready: Redis, latido de los consumidores y checkpoints (si no, el
          # pod sale de la rotación hasta recuperarse; no se reinicia).
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# Solo para Prometheus y para depurar (/health, /ready, /metrics): el worker no
# recibe tráfico; los emails le llegan por Redis Streams.
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
spec:
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
