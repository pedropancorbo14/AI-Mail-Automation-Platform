# Red del namespace: todo denegado salvo lo que se abre aquí. Si un pod se
# ve comprometido (p. ej. por una dependencia), no puede hablar con nada que
# no necesite: ai-mcp solo recibe de ai-service y solo sale a Laravel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS para todos los pods del namespace (CoreDNS de kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# ai-service: entran Prometheus (métricas) y Laravel (API interna, con token)
# y sale a lo que usa.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 8000}
    # Laravel (app y workers, etiqueta app.kubernetes.io/name: laravel): API
    # interna /internal/v1 (búsqueda del panel, herramientas por empresa).
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: laravel
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    # Servidor MCP del namespace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-mcp
      ports:
        - {protocol: TCP, port: 8100}
    # Redis, PostgreSQL, Ollama y Laravel (descarga de documentos, puerto 80):
    # en producción son de la plataforma (fuera de este namespace y con IP que
    # no conoce el manifiesto), así que se abre el puerto, no el destino. La API
    # de Anthropic, por HTTPS.
    - ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
---
# ai-mcp: solo ai-service puede llamarlo. Sale solo a Laravel (qué tiene
# conectado cada empresa y sus pedidos importados, Fase 14): fuera de este
# namespace en producción, así que se abre el puerto (80/443), no el destino.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-service
      ports:
        - {protocol: TCP, port: 8100}
  egress:
    - ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
