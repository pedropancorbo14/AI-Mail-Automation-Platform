# Servidor MCP (CRM, ERP, tickets y facturas de demostración). Solo lo llama
# ai-service, con token; no se publica fuera del clúster.
#
# Una réplica a propósito: los tickets que crea viven en memoria (backend de
# demostración hasta las integraciones reales de la Fase 14 de la plataforma),
# así que dos réplicas no compartirían ni los tickets ni la idempotencia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mcp
  labels:
    app.kubernetes.io/name: ai-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: ai-mcp
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: aimail/ai-service:dev
          imagePullPolicy: IfNotPresent
          command: ["ai-service-mcp"]
          ports:
            - name: mcp
              containerPort: 8100
          env:
            # Solo lo que necesita: ni la clave de Anthropic ni Redis.
            - name: AI_SERVICE_ENVIRONMENT
              valueFrom:
                configMapKeyRef: {name: ai-service-config, key: AI_SERVICE_ENVIRONMENT}
            - name: AI_SERVICE_LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: ai-service-config, key: AI_SERVICE_LOG_LEVEL}
            - name: AI_SERVICE_MCP_TOKEN
              valueFrom:
                secretKeyRef: {name: ai-service-secrets, key: AI_SERVICE_MCP_TOKEN}
            - name: AI_SERVICE_MCP_ORDERS_FILE
              value: /data/orders.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: {path: /health, port: mcp}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: mcp}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health, port: mcp}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: demo-data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: demo-data
          configMap:
            name: ai-mcp-demo-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-mcp
  labels:
    app.kubernetes.io/name: ai-mcp
spec:
  selector:
    app.kubernetes.io/name: ai-mcp
  ports:
    - name: mcp
      port: 8100
      targetPort: mcp
