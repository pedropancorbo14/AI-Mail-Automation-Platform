name: Tests

on:
  push:
    # También las ramas de fase: se ve el CI en cuanto se publican, antes del PR.
    branches: [main, "fase-*"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_testing
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # Servidor de correo de pruebas (tests de IMAP/SMTP contra servidor real)
      GREENMAIL_HOST: 127.0.0.1

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_testing
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      greenmail:
        image: greenmail/standalone:2.1.5
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users.login=email
        ports:
          - 3025:3025
          - 3143:3143
          - 8080:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, bcmath, mbstring, zip, intl
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Fase 12: falla si alguna dependencia de PHP tiene una vulnerabilidad conocida.
      - name: Auditar dependencias de PHP
        run: composer audit --no-interaction

      - name: Generar APP_KEY para el entorno de test
        run: php artisan key:generate --env=testing

      - name: Crear extensión vector en app_testing
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U app -d app_testing -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=secret psql -h 127.0.0.1 -U app -d app_testing -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Ejecutar migraciones
        run: php artisan migrate --force --env=testing

      - name: Esperar a GreenMail
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/configuration > /dev/null && exit 0
            sleep 2
          done
          echo "GreenMail no arrancó" && exit 1

      - name: Ejecutar tests (Pest)
        run: ./vendor/bin/pest

  # Panel de administración (Fase 10): tipos, tests y compilación.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Fase 12: vulnerabilidades altas o críticas en lo que llega al navegador.
      - name: Auditar dependencias del panel
        run: npm audit --omit=dev --audit-level=high

      - name: Comprobar tipos (vue-tsc)
        run: npm run typecheck

      - name: Tests del panel (Vitest)
        run: npm test

      - name: Compilar el panel
        run: npx vite build

  # Observabilidad (Fase 11): configuración de Prometheus y pruebas de las alertas.
  observability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar la configuración de Prometheus
        run: >
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus" -w /etc/prometheus
          --entrypoint promtool prom/prometheus:v3.15.0 check config prometheus.yml

      - name: Probar las alertas (promtool test rules)
        run: >
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus" -w /etc/prometheus
          --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts.test.yml

      - name: Validar los dashboards de Grafana
        run: |
          python3 - <<'PY'
          import glob, json, sys
          # JSON válido, uid único y solo los datasources provisionados (uid fijos).
          uids, ok = set(), True
          for f in sorted(glob.glob('docker/grafana/dashboards/*.json')):
              d = json.load(open(f))
              ok &= d['uid'] not in uids; uids.add(d['uid'])
              for p in d['panels']:
                  for t in p.get('targets', []) + [p]:
                      ds = t.get('datasource')
                      if ds and ds.get('uid') not in ('prometheus', 'loki'):
                          print(f'{f}: datasource desconocido en "{p.get("title")}"'); ok = False
          print(f'{len(uids)} dashboards'); sys.exit(0 if ok else 1)
          PY

  # Microservicio de IA en Python (ai-service/): lint, tipos, reglas de capas
  # y tests. El LLM siempre está simulado: nunca se llama a la API real.
  ai-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AI_SERVICE_ENVIRONMENT: testing
      AI_SERVICE_TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      - name: Dependencias (exactas, de uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Formato (ruff format)
        run: uv run ruff format --check .

      - name: Tipos (mypy estricto)
        run: uv run mypy

      - name: Reglas de la arquitectura hexagonal (import-linter)
        run: uv run lint-imports

      - name: Tests (pytest)
        run: uv run pytest

      - name: Auditar dependencias de Python (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit@2.10.0 --strict --disable-pip --require-hashes -r /tmp/requirements.txt

      # La imagen se construye en cada push: un Dockerfile roto no llega a main.
      - name: Construir la imagen Docker
        run: docker build -t ai-mail-automation-ai-service:ci .

      - name: Probar la imagen (arranca, /health y usuario sin privilegios)
        run: |
          docker run -d --name ai-service --network host --read-only --tmpfs /tmp --cap-drop ALL \
            -e AI_SERVICE_ANTHROPIC_API_KEY=sk-ant-ci-placeholder \
            -e AI_SERVICE_REDIS_URL=redis://127.0.0.1:6379/14 \
            ai-mail-automation-ai-service:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/ready && break; sleep 1; done
          curl -fs localhost:8000/health
          test "$(docker exec ai-service id -u)" = "10001"
          docker stop -t 20 ai-service
